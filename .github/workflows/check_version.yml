name: Check Version Update

on:
  pull_request:
    branches:
      - master
    paths:
      - 'py_package/setup.py'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Extract PR version
      id: pr_version
      run: |
        PR_VERSION=$(grep -oP "version='\K[^']+" py_package/setup.py)
        echo "pr_version=$PR_VERSION" >> $GITHUB_OUTPUT
        echo "PR Version: $PR_VERSION"

    - name: Extract master version
      id: master_version
      run: |
        git fetch origin master
        MASTER_VERSION=$(git show origin/master:py_package/setup.py | grep -oP "version='\K[^']+")
        echo "master_version=$MASTER_VERSION" >> $GITHUB_OUTPUT
        echo "Master Version: $MASTER_VERSION"

    - name: Compare versions
      id: compare_versions
      run: |
        if [ "${{ steps.pr_version.outputs.pr_version }}" == "${{ steps.master_version.outputs.master_version }}" ]; then
          echo "::error::Version in setup.py must be updated from '${{ steps.master_version.outputs.master_version }}' when making a PR to master branch"
          exit 1
        else
          echo "Version was updated from '${{ steps.master_version.outputs.master_version }}' to '${{ steps.pr_version.outputs.pr_version }}'"
        fi 