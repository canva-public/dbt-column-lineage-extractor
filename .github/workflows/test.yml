name: Python Tests

on:
  push:
    branches:
    - '**' # Run on all branches
    - '!main' # Exclude main branch
    - '!master' # Exclude master branch
  pull_request:
    branches:
    - main
    - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Debug file structure
      run: |
        pwd
        echo "Current directory contents:"
        ls -la
        echo "py_package directory contents:"
        ls -la py_package/
        echo "README.md location:"
        find . -name "README.md"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build setuptools wheel

    - name: Install package dependencies
      run: |
        pip install pytest
        pip install -r py_package/requirements.txt

    - name: Install package in editable mode
      run: |
        cd py_package
        pip install -e .
        cd ..

    - name: Setup test data
      run: |
        mkdir -p tests/test_data/inputs
        cp -r examples/inputs/* tests/test_data/inputs/

    - name: Verify test data
      run: |
        ls -la tests/test_data/inputs/
        echo "Test data files:"
        find tests/test_data/inputs/ -type f -exec ls -lh {} \;

    - name: Run tests with pytest
      run: |
        python -m pytest -v tests/ --capture=no
